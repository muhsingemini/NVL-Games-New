<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVL Games — Canlı PUBG Mobile Turnuva Platformu</title>
<link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="">
<style>
  :root {
    --bg-main: #0F131A;
    --bg-card: #151A23;
    --bg-elevated: #1B212D;
    --bg-input: #10141C;
    --border: #232A38;
    --border-soft: rgba(255,255,255,0.07);
    --text: #F3F5F8;
    --text-muted: #8E98AA;
    --accent: #E11D48;
    --accent-hover: #BE123C;
    --accent-soft: rgba(225, 29, 72, 0.14);
    --success: #10B981;
    --success-soft: rgba(16, 185, 129, 0.14);
    --warning: #F59E0B;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    --drawer-backdrop: rgba(4, 6, 10, 0.68);
  }

  [data-theme="light"] {
    --bg-main: #F4F6FA;
    --bg-card: #FFFFFF;
    --bg-elevated: #EEF2F7;
    --bg-input: #F8FAFC;
    --border: #DCE2EC;
    --border-soft: rgba(15, 23, 42, 0.08);
    --text: #0F172A;
    --text-muted: #5A657A;
    --accent: #E11D48;
    --accent-hover: #BE123C;
    --accent-soft: rgba(225, 29, 72, 0.10);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.12);
    --warning: #D97706;
    --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    --drawer-backdrop: rgba(15, 23, 42, 0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    transition: background-color 0.2s ease, color 0.2s ease;
    overflow-x: hidden;
  }

  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: transparent; }
  .container { max-width: 1260px; margin: 0 auto; padding: 0 20px; }

  /* NAVBAR */
  .navbar {
    position: sticky; top: 0; z-index: 60; height: 68px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
  }
  .navbar-inner {
    height: 100%; max-width: 1360px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand-emblem-box {
    width: 42px; height: 38px; border-radius: 9px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
  }
  .brand-emblem-img {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .live-dot-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: var(--success-soft); color: var(--success); border: 1px solid rgba(16,185,129,0.35);
  }
  .live-dot-pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--success);
    animation: livePulse 1.4s infinite ease-in-out;
  }
  @keyframes livePulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(0.8); } }

  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-link { padding: 8px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
  .nav-link:hover, .nav-link.active { color: var(--text); background: var(--bg-elevated); }
  .nav-right { display: flex; align-items: center; gap: 8px; }

  .btn {
    padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--text-muted); }
  .btn-success { background: var(--success-soft); color: var(--success); border: 1px solid rgba(16,185,129,0.35); }

  .balance-pill {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
    padding: 5px 12px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15;
  }
  .balance-pill:hover { border-color: var(--accent); }
  .balance-pill .top { font-size: 11px; color: var(--accent); font-weight: 800; }
  .balance-pill .val { font-size: 13.5px; font-weight: 800; }

  .icon-btn {
    position: relative; width: 38px; height: 38px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 16px;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg {
    width: 18px; height: 18px; stroke: var(--text); fill: none;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-btn.bell-btn svg { stroke: #F87171; }
  .badge-count {
    position: absolute; top: -6px; right: -6px; min-width: 20px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800;
    display: none; align-items: center; justify-content: center;
  }
  .badge-count.show { display: inline-flex; }

  .page-section { padding: 26px 0 52px; }
  .section-block { margin-top: 32px; }
  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .section-title { font-size: 24px; font-weight: 800; }
  .section-sub { color: var(--text-muted); font-size: 13.5px; margin-top: 3px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .empty-box { background: var(--bg-card); border: 1px dashed var(--border); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--text-muted); }

  .pill {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
  }
  .pill.active, .pill:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tag-live {
    background: rgba(225,29,72,0.22); color: #fda4af; border: 1px solid rgba(225,29,72,0.45);
    padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase;
  }

  /* HOME STATS & TEAM LEADERBOARD */
  .home-stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 12px;
  }
  .home-stat-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 4px;
  }
  .home-stat-card strong { font-size: 26px; font-weight: 900; color: var(--accent); }
  .home-stat-card span { font-size: 13px; color: var(--text-muted); font-weight: 600; }

  .lb-team-row {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 11px; background: var(--bg-elevated);
    border: 1px solid var(--border-soft); margin-top: 9px;
  }
  .lb-team-rank { font-weight: 900; font-size: 16px; color: var(--accent); }
  .lb-team-pts { text-align: right; }
  .lb-team-pts strong { font-size: 18px; font-weight: 900; display: block; color: var(--text); }
  .lb-team-pts small { font-size: 11.5px; color: var(--text-muted); }

  /* TOURNAMENT CARDS */
  .tour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
  .tour-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .tour-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .tour-banner {
    padding: 16px 18px; background: radial-gradient(circle at top right, rgba(225,29,72,0.38), rgba(15,19,26,0.96));
    border-bottom: 1px solid var(--border); min-height: 120px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .tour-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .tour-schedule-box {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: var(--bg-elevated); border-radius: 10px; padding: 10px;
  }
  .tour-schedule-box small { display: block; font-size: 11px; color: var(--text-muted); }
  .tour-money-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 6px; border-top: 1px solid var(--border-soft); }
  .tour-money-row small { display: block; font-size: 11.5px; color: var(--text-muted); }
  .progress-track { height: 6px; background: var(--bg-elevated); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--accent); }

  /* TURNUVA MERKEZİ */
  .tm-hero {
    background: linear-gradient(135deg, rgba(127, 29, 45, 0.55), rgba(21, 26, 35, 0.96));
    border: 1px solid rgba(225, 29, 72, 0.35);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .tm-hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .tm-hero-main { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .tm-trophy-box {
    width: 64px; height: 64px; border-radius: 14px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12); display: grid; place-items: center; font-size: 26px;
  }
  .tm-hero-bottom {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.09); font-size: 13px;
  }

  .tm-tabs-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 8px; border-radius: 14px; margin-bottom: 20px;
  }
  .tm-tab {
    padding: 10px 15px; border-radius: 10px; font-size: 13px; font-weight: 700;
    color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
  }
  .tm-tab:hover { color: var(--text); background: var(--bg-elevated); }
  .tm-tab.active { background: var(--accent-soft); color: #fda4af; border: 1px solid rgba(225,29,72,0.4); }

  .tm-quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
  .tm-quick-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 13px;
    padding: 16px; text-align: left; transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .tm-quick-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tm-quick-card small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 4px; }

  .team-logo-img {
    width: 44px; height: 44px; border-radius: 11px; object-fit: cover;
    background: var(--bg-elevated); border: 1px solid var(--border); display: inline-grid; place-items: center;
    font-weight: 900; font-size: 15px; color: var(--accent); flex-shrink: 0;
  }

  /* OBS HUD */
  .obs-screen {
    min-height: 100vh; background: transparent; color: #fff;
    padding: 28px; position: relative; font-family: Inter, sans-serif;
  }
  .obs-right-board {
    position: fixed; top: 28px; right: 28px; width: 430px;
    background: rgba(11, 15, 23, 0.90); border: 1px solid rgba(225, 29, 72, 0.6);
    border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.65);
  }
  .obs-board-head {
    background: linear-gradient(90deg, #E11D48, #9F1239);
    padding: 11px 16px; font-weight: 900; font-size: 13px; letter-spacing: 0.7px;
    display: flex; justify-content: space-between;
  }
  .obs-row {
    display: grid; grid-template-columns: 38px 1fr 56px 56px 64px;
    align-items: center; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; font-weight: 700;
  }
  .obs-left-match {
    position: fixed; bottom: 28px; left: 28px;
    background: rgba(11, 15, 23, 0.92); border: 1px solid rgba(255,255,255,0.16);
    border-left: 4px solid #E11D48; border-radius: 12px; padding: 12px 18px;
    display: flex; align-items: center; gap: 14px;
  }

  /* BADGES */
  .badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .badge-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .badge-card-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .badge-num { background: var(--bg-elevated); border: 1px solid var(--border); padding: 3px 8px; border-radius: 7px; font-size: 11px; font-weight: 800; }
  .badge-emblem-wrap { height: 110px; display: grid; place-items: center; margin: 8px 0; }
  .badge-req { border-top: 1px solid var(--border-soft); padding-top: 10px; font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; }

  /* WALLET / ÖDEMELERİM */
  .wallet-tabs {
    display: flex; gap: 8px; flex-wrap: wrap; background: var(--bg-card);
    border: 1px solid var(--border); padding: 8px; border-radius: 12px; margin-bottom: 18px;
  }
  .wallet-tab-btn { padding: 9px 15px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .wallet-tab-btn.active { background: var(--accent); color: #fff; }
  .wallet-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  .amount-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 16px; }
  .amount-btn { padding: 12px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid var(--border); font-weight: 800; font-size: 14px; }
  .amount-btn.active, .amount-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .iban-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--bg-elevated); }

  /* COMMON UI */
  .two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; margin-top: 16px; }
  .chat-box, .lfg-card { padding: 18px; }
  .chat-messages { min-height: 190px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; margin: 12px 0; }
  .msg-row { background: var(--bg-elevated); border-radius: 10px; padding: 10px 12px; }
  .msg-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .msg-author { font-weight: 700; color: var(--accent); }
  .msg-time { color: var(--text-muted); }
  .chat-form { display: flex; gap: 8px; }

  .input, .select, .textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
  }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); }
  .input:disabled { opacity: 0.55; cursor: not-allowed; }

  .lfg-list { display: flex; flex-direction: column; gap: 9px; }
  .lfg-item {
    background: var(--bg-elevated); border-radius: 10px; padding: 11px 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .lfg-item small { color: var(--text-muted); font-size: 12px; display: block; }

  .score-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  .score-table th, .score-table td { padding: 11px 12px; border-bottom: 1px solid var(--border-soft); text-align: left; }
  .score-table th { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; }

  @keyframes idAlertBlink {
    0%, 100% { border-color: #E11D48; background: rgba(225, 29, 72, 0.16); }
    50% { border-color: #F59E0B; background: rgba(245, 158, 11, 0.18); }
  }
  .blink-id-alert { border: 1.5px solid #E11D48; border-radius: 12px; padding: 12px 14px; animation: idAlertBlink 1.3s infinite ease-in-out; }

  .link-btn { color: var(--text); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); }
  .link-btn:hover { color: var(--accent); }

  .drawer-backdrop { position: fixed; inset: 0; background: var(--drawer-backdrop); z-index: 90; display: none; justify-content: flex-end; }
  .drawer-backdrop.open { display: flex; }
  .drawer-panel { width: 100%; max-width: 380px; height: 100%; background: var(--bg-card); border-left: 1px solid var(--border); padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .drawer-btn { width: 100%; padding: 12px 14px; border-radius: 11px; background: var(--bg-elevated); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
  .drawer-btn:hover { border-color: var(--accent); }
  .drawer-btn.highlight { background: var(--accent-soft); border-color: rgba(225,29,72,0.45); color: var(--accent); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(4, 6, 10, 0.72); z-index: 110; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal-card { width: 100%; max-width: 520px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-elevated); border: 1px solid var(--accent); padding: 11px 18px;
    border-radius: 11px; font-size: 13.5px; font-weight: 600; z-index: 140; opacity: 0; pointer-events: none; transition: all 0.22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SETTINGS PAGE */
  .settings-top-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .settings-grid-wrap {
    display: grid; grid-template-columns: 265px 1fr; gap: 22px; align-items: start;
  }
  .settings-sidebar-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; position: sticky; top: 86px;
  }
  .settings-search-wrap { position: relative; margin: 10px 0 12px; }
  .settings-search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; stroke: var(--text-muted); fill: none; stroke-width: 2;
  }
  .settings-search-wrap input { padding-left: 33px; border-radius: 10px; font-size: 13px; }
  .settings-nav-item {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    color: var(--text-muted); text-align: left; transition: all 0.18s ease; margin-bottom: 3px;
  }
  .settings-nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; flex-shrink: 0; }
  .settings-nav-item:hover { background: var(--bg-elevated); color: var(--text); }
  .settings-nav-item.active { background: rgba(225, 29, 72, 0.16); color: #FB7185; }
  .settings-acc-list { display: flex; flex-direction: column; gap: 12px; }
  .settings-acc-item {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 15px;
    overflow: hidden; transition: border-color 0.2s ease;
  }
  .settings-acc-item.open, .settings-acc-item:hover { border-color: rgba(225, 29, 72, 0.45); }
  .settings-acc-trigger {
    width: 100%; padding: 18px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 14px; text-align: left;
  }
  .settings-acc-left { display: flex; align-items: center; gap: 14px; }
  .settings-icon-box {
    width: 42px; height: 42px; border-radius: 11px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .settings-icon-box svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 1.9; }
  .settings-acc-title { font-size: 15.5px; font-weight: 800; display: block; }
  .settings-acc-sub { font-size: 12.5px; color: var(--text-muted); display: block; margin-top: 2px; }
  .settings-acc-body { padding: 18px 20px 20px; border-top: 1px solid var(--border-soft); background: rgba(0, 0, 0, 0.12); }
  .search-hl { background: #F43F5E; color: #fff; padding: 1px 5px; border-radius: 4px; font-weight: 800; }

  .subpage-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

      ...structuredClone(DEFAULT_SHARED_STATE),
      ...parsed,
      siteLogoUrl: parsed.siteLogoUrl || DEFAULT_NVL_LOGO_DATA_URL

  } catch {

    if (!raw) return { theme: 'dark', currentUsername: null, adminUnlocked: false, activeVoiceChannel: null, micEnabled: true, speakerEnabled: true };

function buildMergedState() {
  const curUser = session.currentUsername
    ? (shared.users || []).find(u => u.username === session.currentUsername) || null
    : null;
  return {
    ...shared,
    siteLogoUrl: shared.siteLogoUrl || DEFAULT_NVL_LOGO_DATA_URL,

function saveSession() {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch {}
  state = buildMergedState();
}

function applyIncomingShared(nextData, shouldRender = true) {
  if (!nextData || typeof nextData !== 'object') return;
  shared = {
    ...structuredClone(DEFAULT_SHARED_STATE),
    ...nextData,
    siteLogoUrl: nextData.siteLogoUrl || DEFAULT_NVL_LOGO_DATA_URL,
    forumVoiceChannels: Array.isArray(nextData.forumVoiceChannels) && nextData.forumVoiceChannels.length === 5
      ? nextData.forumVoiceChannels
      : structuredClone(DEFAULT_SHARED_STATE.forumVoiceChannels)
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(shared));
  } catch {}
  state = buildMergedState();
  applyFaviconLogo(state.siteLogoUrl);
  if (shouldRender) renderAll(true);
}

async function commitSharedMutation(mutatorFn) {
  const draft = structuredClone(shared);
  mutatorFn(draft);
  draft.updatedAt = Date.now();
  applyIncomingShared(draft, true);

  if (bc) {
    try { bc.postMessage({ type: 'SYNC_STATE', payload: draft }); } catch {}
  }

  if (firestoreDocRef) {
    try {
      await setDoc(firestoreDocRef, draft);
    } catch (err) {
      console.warn('Firestore yazma hatası:', err);
    }
  }
}

if (bc) {
  bc.onmessage = (ev) => {
    if (ev.data?.type === 'SYNC_STATE' && ev.data.payload) {
      applyIncomingShared(ev.data.payload, true);
    }
  };
}

window.addEventListener('storage', (ev) => {
  if (ev.key === STORAGE_KEY && ev.newValue) {
    try {
      applyIncomingShared(JSON.parse(ev.newValue), true);
    } catch {}
  }
});

async function initRealtimeBackend() {
  try {
    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
      const cfg = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'nvl-games-live';
      const app = initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      if (!auth.currentUser) return;
      firestoreDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'platform', 'live_state');
      syncModeLabel = 'Canlı Cloud Senkron';

      onSnapshot(firestoreDocRef, (snap) => {
        if (snap.exists()) {
          const remote = snap.data();
          if ((remote.updatedAt || 0) >= (shared.updatedAt || 0)) {
            applyIncomingShared(remote, true);
          }
        } else if ((shared.updatedAt || 0) > 0) {
          setDoc(firestoreDocRef, shared).catch(() => {});
        }
      }, (err) => {
        console.warn('onSnapshot dinleme hatası:', err);
      });
    }
  } catch (e) {
    console.warn('Yerel gerçek zamanlı senkronizasyon aktif:', e);
  }
}

function canUserAccessLiveTournamentData(tour) {
  if (!state.currentUser || !tour) return false;
  if (state.currentUser.username === tour.creator) return true;
  const myTeam = getUserTeam(state.currentUser.username);
  if (!myTeam) return false;
  return (tour.joinedTeams || []).includes(myTeam.id);
}

function getUnreadNotificationsCount() {

function pushNotificationToTarget(targetShared, username, text) {
  targetShared.notifications[username] = targetShared.notifications[username] || [];
  targetShared.notifications[username].unshift({

    text,
    time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
    read: false
  });
}

function calcPlacementPoints(rank) {
  const r = Number(rank);
  if (!r || r < 1) return 0;
  const table = { 1: 10, 2: 6, 3: 5, 4: 4, 5: 3, 6: 2, 7: 1, 8: 1 };
  return table[r] || 0;
}

function computeTournamentStandings(tour) {
  const scores = tour.matchScores || {};
  const joined = tour.joinedTeams || [];
  const rows = joined.map(teamId => {
    const tm = state.teams.find(x => x.id === teamId);
    let placePts = 0;
    let kills = 0;
    let enteredMatches = 0;

    for (let m = 1; m <= Number(tour.matches || 1); m++) {
      const ms = (scores[m] && scores[m][teamId]) || null;
      if (ms && (ms.rank !== '' || ms.kills !== '')) {
        enteredMatches++;
        placePts += calcPlacementPoints(ms.rank);
        kills += Number(ms.kills || 0);
      }
    }

    return {
      teamId,
      teamName: tm ? tm.name : teamId,
      tag: tm ? tm.tag : '',
      logoUrl: tm ? tm.logoUrl : '',
      placePts,
      kills,
      totalPts: placePts + kills,
      enteredMatches
    };
  });

  rows.sort((a, b) => b.totalPts - a.totalPts || b.kills - a.kills);
  return rows;
}

function computeGlobalTeamsLeaderboard() {
  const totalsByTeam = new Map();

  state.teams.forEach(tm => {
    totalsByTeam.set(tm.id, {
      teamId: tm.id,
      name: tm.name,
      tag: tm.tag,
      logoUrl: tm.logoUrl || '',
      matchesPlayed: 0,
      placementPts: 0,
      kills: 0,
      totalPts: 0
    });
  });

  state.tournaments.forEach(tour => {
    const scores = tour.matchScores || {};
    (tour.joinedTeams || []).forEach(tid => {
      if (!totalsByTeam.has(tid)) {
        const tm = state.teams.find(x => x.id === tid);
        totalsByTeam.set(tid, {
          teamId: tid,
          name: tm ? tm.name : tid,
          tag: tm ? tm.tag : '',
          logoUrl: tm ? tm.logoUrl : '',
          matchesPlayed: 0,
          placementPts: 0,
          kills: 0,
          totalPts: 0
        });
      }
      const entry = totalsByTeam.get(tid);
      for (let m = 1; m <= Number(tour.matches || 1); m++) {
        const ms = scores[m]?.[tid];
        if (ms && (ms.rank !== '' || ms.kills !== '')) {
          entry.matchesPlayed += 1;
          const p = calcPlacementPoints(ms.rank);
          const k = Number(ms.kills || 0);
          entry.placementPts += p;
          entry.kills += k;
          entry.totalPts += p + k;
        }
      }
    });
  });

  return [...totalsByTeam.values()].sort((a, b) => b.totalPts - a.totalPts || b.kills - a.kills);
}

function areAllTournamentScoresCompleted(tour) {
  const joined = tour.joinedTeams || [];
  if (joined.length === 0) return false;
  const totalMatches = Number(tour.matches || 1);
  for (let m = 1; m <= totalMatches; m++) {
    for (const tid of joined) {
      const entry = tour.matchScores?.[m]?.[tid];
      if (!entry || entry.rank === '' || entry.rank === undefined || entry.kills === '' || entry.kills === undefined) {
        return false;
      }
    }
  }
  return true;
}

function renderTeamLogoHtml(team, size = 44) {

  }
  const letter = (team?.tag || team?.name || 'T').slice(0, 2).toUpperCase();
  return `<span class="team-logo-img" style="width:${size}px;height:${size}px;">${escapeHtml(letter)}</span>`;
}

function syncTournamentTimings() {
  const now = Date.now();
  const hasDue = state.tournaments.some(t => {
    if (t.status !== 'open') return false;
    const startMs = new Date(`${t.date}T${t.time}:00`).getTime();
    return !Number.isNaN(startMs) && now >= startMs;
  });
  if (hasDue) {
    commitSharedMutation(s => {
      s.tournaments.forEach(t => {
        if (t.status === 'open') {
          const startMs = new Date(`${t.date}T${t.time}:00`).getTime();
          if (!Number.isNaN(startMs) && now >= startMs) t.status = 'live';
        }
      });
    });
  }
}

async function submitRegister(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = fd.get('username').trim().replace(/^@+/, '').toLowerCase();
  const email = fd.get('email').trim().toLowerCase();
  const password = fd.get('password');

  if (state.users.some(u => u.username === username || u.email === email)) {
    showToast('Bu kullanıcı adı veya e-posta zaten kayıtlı.');
    return;
  }

  const u = {
    id: 'u_' + Date.now(),
    name: username,
    username,
    email,
    password,
    pubgName: fd.get('pubgName').trim(),
    pubgId: fd.get('pubgId').trim(),
    role: 'Entry Fragger',
    bio: '',
    instagram: '',
    tiktok: '',
    cardTheme: 'Klasik Arena',
    siteLanguage: 'Otomatik (cihaz dili)',
    deviceNotifications: true,
    balance: 0,
    canCreateTournament: false,
    badges: ['NVL Üye'],
    joinedAt: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
  };

  session.currentUsername = username;
  saveSession();
  await commitSharedMutation(s => {
    s.users.push(u);
  });
  closeModal();
  showToast('Kayıt tamamlandı!');
}

function submitLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const idVal = fd.get('identifier').trim().replace(/^@+/, '').toLowerCase();
  const passVal = fd.get('password');
  const found = state.users.find(u => (u.username === idVal || u.email === idVal) && u.password === passVal);
  if (!found) { showToast('Giriş bilgileri hatalı.'); return; }
  session.currentUsername = found.username;
  saveSession();
  closeModal();
  showToast(`Hoş geldin @${found.username}`);
  renderAll(false);
}

function logoutUser() {
  session.currentUsername = null;
  session.activeVoiceChannel = null;
  saveSession();
  if (['team', 'organizer', 'dm', 'settings', 'wallet'].includes(activeView)) activeView = 'home';
  closeExploreDrawer();
  renderAll(false);
}

function restoreFocusSnapshot(snap) {
  if (!snap) return;
  const target = snap.id
    ? document.getElementById(snap.id)
    : (snap.name ? document.querySelector(`[name="${snap.name}"]`) : null);
  if (target) {
    target.focus();
    if (typeof snap.value === 'string') target.value = snap.value;
    if (typeof snap.start === 'number' && target.setSelectionRange) {
      try { target.setSelectionRange(snap.start, snap.end); } catch {}
    }
  }
}

async function requestJoinTournament(tourId) {
  if (!state.currentUser) { openAuthModal('login'); return; }
  if (state.currentUser.canCreateTournament) { showToast('Organizatörler turnuvaya katılamaz.'); return; }
  const myTeam = getUserTeam(state.currentUser.username);
  if (!myTeam) { showToast('Önce Takımım sekmesinden takımınızı kurun.'); navigate('team'); return; }
  const tour = state.tournaments.find(t => t.id === tourId);
  if (!tour) return;

  await commitSharedMutation(s => {
    const tr = s.tournaments.find(t => t.id === tourId);
    if (!tr) return;
    tr.pendingTeams = tr.pendingTeams || [];
    if (!tr.pendingTeams.includes(myTeam.id) && !(tr.joinedTeams || []).includes(myTeam.id)) {
      tr.pendingTeams.push(myTeam.id);
    }
  });
  showToast('Katılma isteği anında organizatöre gönderildi.');
}

async function toggleTournamentChat(tourId) {
  await commitSharedMutation(s => {
    const tour = s.tournaments.find(t => t.id === tourId);
    if (tour && state.currentUser && state.currentUser.username === tour.creator) {
      tour.chatClosed = !tour.chatClosed;
    }
  });
}

async function sendTournamentChat(e, tourId) {
  e.preventDefault();
  const tour = state.tournaments.find(t => t.id === tourId);
  if (!tour || tour.chatClosed || !canUserAccessLiveTournamentData(tour)) return;
  const inp = document.getElementById('tourChatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  await commitSharedMutation(s => {
    s.tournamentChats[tourId] = s.tournamentChats[tourId] || [];
    s.tournamentChats[tourId].push({
      author: state.currentUser.username,
      text,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
  });
}

async function approveTeamJoinRequest(tourId, teamId) {
  await commitSharedMutation(s => {
    const tour = s.tournaments.find(t => t.id === tourId);
    const team = s.teams.find(t => t.id === teamId);
    if (!tour || !team) return;
    tour.pendingTeams = (tour.pendingTeams || []).filter(id => id !== teamId);
    tour.joinedTeams = tour.joinedTeams || [];
    if (!tour.joinedTeams.includes(teamId)) tour.joinedTeams.push(teamId);
    if (!s.tournamentRosters[`${tourId}_${teamId}`]) {
      s.tournamentRosters[`${tourId}_${teamId}`] = { mainIds: ['', '', '', ''], subIds: ['', ''], subSwapsUsed: 0 };
    }
    pushNotificationToTarget(s, team.ownerUsername, `"${tour.title}" turnuvasına onay aldınız, ID'lerinizi girin.`);
  });
  showToast('Ekip onaylandı ve bildirim gönderildi!');
}

async function saveMatchScores(e, tourId, matchNo) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await commitSharedMutation(s => {
    const tour = s.tournaments.find(t => t.id === tourId);
    if (!tour) return;
    tour.matchScores = tour.matchScores || {};
    tour.matchScores[matchNo] = {};
    (tour.joinedTeams || []).forEach(tid => {
      const r = fd.get(`rank_${tid}`);
      const k = fd.get(`kills_${tid}`);
      tour.matchScores[matchNo][tid] = { rank: r === '' ? '' : Number(r), kills: k === '' ? '' : Number(k) };
    });
    if (areAllTournamentScoresCompleted(tour)) tour.status = 'completed';
  });
  showToast(`Maç #${matchNo} skorları canlı olarak yansıtıldı.`);
}

function renderFriendTournamentIdCard(tour, myTeam) {
  const rKey = `${tour.id}_${myTeam.id}`;
  const roster = state.tournamentRosters[rKey] || { mainIds: ['', '', '', ''], subIds: ['', ''], subSwapsUsed: 0 };
  const startMs = new Date(`${tour.date}T${tour.time}:00`).getTime();
  const now = Date.now();
  const isLive = tour.status === 'live' || (!Number.isNaN(startMs) && now >= startMs);
  const locked2h = !isLive && !Number.isNaN(startMs) && (startMs - now) <= 2 * 60 * 60 * 1000;
  const remSubs = Math.max(0, 2 - (roster.subSwapsUsed || 0));
  const canMain = !isLive && !locked2h && tour.status !== 'completed';
  const canSub = (!isLive && !locked2h && tour.status !== 'completed') || (isLive && remSubs > 0);

  return `
    <div class="card" style="padding:20px; margin-top:20px;">
      <div class="eyebrow">TURNUVA KADRO ID YÖNETİMİ</div>
      <h3 style="margin-bottom:8px;">${escapeHtml(tour.title)}</h3>
      <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">
        ${isLive ? `CANLI — Sadece 2 yedek ID değiştirilebilir (Kalan hak: ${remSubs}/2).` :
          locked2h ? '🔒 Turnuvaya 2 saatten az kaldığı için kilitli.' :
          'Turnuvaya 2 saat kalana kadar 4 Ana + 2 Yedek ID girebilirsiniz.'}
      </p>
      <form onsubmit="saveTeamRosterIds(event, '${tour.id}', '${myTeam.id}')">
        <div class="form-grid-2">
          ${[0,1,2,3].map(i => `<div class="form-group"><label>Ana Kadro #${i+1} ID</label><input class="input" name="m_${i}" value="${escapeAttr(roster.mainIds[i] || '')}" ${!canMain ? 'disabled' : ''}></div>`).join('')}
          ${[0,1].map(i => `<div class="form-group"><label>Yedek Kadro #${i+1} ID</label><input class="input" name="s_${i}" value="${escapeAttr(roster.subIds[i] || '')}" ${!canSub ? 'disabled' : ''}></div>`).join('')}
        </div>
        <button class="btn btn-primary" style="width:100%;" type="submit" ${(!canMain && !canSub) ? 'disabled' : ''}>ID Bilgilerini Kaydet</button>
      </form>
    </div>
  `;
}

async function saveTeamRosterIds(e, tourId, teamId) {
  e.preventDefault();
  const tour = state.tournaments.find(t => t.id === tourId);
  const team = state.teams.find(t => t.id === teamId);
  if (!tour || !team) return;
  const rKey = `${tourId}_${teamId}`;
  const startMs = new Date(`${tour.date}T${tour.time}:00`).getTime();
  const isLive = tour.status === 'live' || (!Number.isNaN(startMs) && Date.now() >= startMs);
  const fd = new FormData(e.target);
  const nowStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

  let blocked = false;
  await commitSharedMutation(s => {
    const roster = s.tournamentRosters[rKey] || { mainIds: ['', '', '', ''], subIds: ['', ''], subSwapsUsed: 0 };
    if (!isLive) {
      for (let i = 0; i < 4; i++) {
        const oldV = (roster.mainIds[i] || '').trim();
        const newV = (fd.get(`m_${i}`) || '').trim();
        if (oldV !== newV && oldV) {
          s.idChangeLogs.unshift({ id: 'idl_' + Date.now() + '_m' + i, creator: tour.creator, teamName: team.name, slotLabel: `Ana #${i + 1}`, oldId: oldV, newId: newV, phase: 'Maç Öncesi', time: nowStr });
        }
        roster.mainIds[i] = newV;
      }
      for (let i = 0; i < 2; i++) {
        const oldV = (roster.subIds[i] || '').trim();
        const newV = (fd.get(`s_${i}`) || '').trim();
        if (oldV !== newV && oldV) {
          s.idChangeLogs.unshift({ id: 'idl_' + Date.now() + '_s' + i, creator: tour.creator, teamName: team.name, slotLabel: `Yedek #${i + 1}`, oldId: oldV, newId: newV, phase: 'Maç Öncesi', time: nowStr });
        }
        roster.subIds[i] = newV;
      }
    } else {
      let changes = 0;
      const nextSubs = [...roster.subIds];
      for (let i = 0; i < 2; i++) {
        const oldV = (roster.subIds[i] || '').trim();
        const newV = (fd.get(`s_${i}`) || '').trim();
        if (oldV !== newV) { changes++; nextSubs[i] = newV; }
      }
      if ((roster.subSwapsUsed || 0) + changes > 2) {
        blocked = true;
        return;
      }
      for (let i = 0; i < 2; i++) {
        const oldV = (roster.subIds[i] || '').trim();
        const newV = nextSubs[i];
        if (oldV !== newV) {
          s.idChangeLogs.unshift({ id: 'idl_' + Date.now() + '_lv' + i, creator: tour.creator, teamName: team.name, slotLabel: `Yedek #${i + 1}`, oldId: oldV || '(Boş)', newId: newV || '(Boş)', phase: 'CANLI', time: nowStr });
        }
      }
      roster.subIds = nextSubs;
      roster.subSwapsUsed = (roster.subSwapsUsed || 0) + changes;
    }
    s.tournamentRosters[rKey] = roster;
  });

  if (blocked) {
    showToast('En fazla 2 yedek ID değişikliği yapılabilir.');
  } else {
    showToast('ID bilgileri kaydedildi ve organizatöre anında iletildi.');
  }
}

async function joinTeamByCode(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const code = fd.get('code').trim().toUpperCase();
  const slotType = fd.get('slotType');
  let errMsg = '';
  await commitSharedMutation(s => {
    const tm = s.teams.find(t => t.inviteCode === code);
    if (!tm) { errMsg = 'Geçersiz davet kodu.'; return; }
    if (slotType === 'main') {
      if ((tm.mainPlayers || []).length >= 4) { errMsg = 'Ana kadro dolu.'; return; }
      tm.mainPlayers.push({ username: state.currentUser.username });
    } else {
      if ((tm.subPlayers || []).length >= 2) { errMsg = 'Yedek kadro dolu.'; return; }
      tm.subPlayers.push({ username: state.currentUser.username });
    }
  });
  if (errMsg) showToast(errMsg);
  else showToast('Takıma katıldınız!');
}

async function kickTeamMember(teamId, targetUsername) {
  await commitSharedMutation(s => {
    const tm = s.teams.find(t => t.id === teamId);
    if (!tm) return;
    tm.mainPlayers = (tm.mainPlayers || []).filter(p => p.username !== targetUsername);
    tm.subPlayers = (tm.subPlayers || []).filter(p => p.username !== targetUsername);
    tm.inviteCode = 'NVL-' + Math.floor(1000 + Math.random() * 9000);
  });
  showToast('Oyuncu atıldı ve davet kodu yenilendi.');
}

}

async function toggleForumVoice(vcId) {
  if (!state.currentUser) { openAuthModal('login'); return; }
  const me = state.currentUser.username;
  const leaving = session.activeVoiceChannel?.type === 'forum' && session.activeVoiceChannel?.id === vcId;
  let full = false;

  await commitSharedMutation(s => {
    s.forumVoiceChannels.forEach(vc => { vc.users = (vc.users || []).filter(u => u !== me); });
    if (leaving) {
      session.activeVoiceChannel = null;
    } else {
      const target = s.forumVoiceChannels.find(v => v.id === vcId);
      if (!target || (target.users || []).length >= 20) { full = true; return; }
      target.users.push(me);
      session.activeVoiceChannel = { type: 'forum', id: vcId };
    }
    saveSession();
  });

  if (full) showToast('Kanal dolu.');
}

function toggleTeamVoice(teamId) {
  if (!state.currentUser) { openAuthModal('login'); return; }
  session.activeVoiceChannel = (session.activeVoiceChannel?.type === 'team' && session.activeVoiceChannel?.id === teamId)
    ? null : { type: 'team', id: teamId };
  saveSession();
  renderAll(false);
}

function toggleMic() { session.micEnabled = !session.micEnabled; saveSession(); renderAll(false); }
function toggleSpeaker() { session.speakerEnabled = !session.speakerEnabled; saveSession(); renderAll(false); }

async function sendForumChat(e) {
  e.preventDefault();
  if (!state.currentUser) { openAuthModal('login'); return; }
  const inp = document.getElementById('forumChatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  await commitSharedMutation(s => {
    s.forumMessages.push({
      id: 'fm_' + Date.now(),
      author: state.currentUser.username,
      text,
      time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
  });
}

function onSettingsSearchInput(val) {
  settingsSearchQuery = val;
  renderAll(true);
}

function jumpToSettingsCard(id) {
  activeSettingsNavId = id;
  openSettingsCardIds.add(id);
  renderAll(false);
  const el = document.getElementById(`set_card_${id}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function toggleSettingsCard(id) {
  activeSettingsNavId = id;
  if (openSettingsCardIds.has(id)) openSettingsCardIds.delete(id);
  else openSettingsCardIds.add(id);
  renderAll(false);
}

async function saveUserSettingFields(e, toastMsg) {
  e.preventDefault();
  if (!state.currentUser) return;
  const fd = new FormData(e.target);
  await commitSharedMutation(s => {
    const u = s.users.find(x => x.username === state.currentUser.username);
    if (!u) return;
    for (const [k, v] of fd.entries()) {
      u[k] = String(v).trim();
    }
  });
  showToast(toastMsg);
}

async function toggleDeviceNotifications() {
  if (!state.currentUser) return;
  await commitSharedMutation(s => {
    const u = s.users.find(x => x.username === state.currentUser.username);
    if (u) u.deviceNotifications = !(u.deviceNotifications !== false);
  });
  showToast('Bildirim tercihi güncellendi.');
}

async function changeUserPassword(e) {
  e.preventDefault();
  if (!state.currentUser) return;
  const newPass = new FormData(e.target).get('newPassword');
  if (!newPass || newPass.length < 4) return;
  await commitSharedMutation(s => {
    const u = s.users.find(x => x.username === state.currentUser.username);
    if (u) u.password = newPass;
  });
  e.target.reset();
  showToast('Hesap şifreniz güncellendi!');
}

async function submitWalletReq(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  await commitSharedMutation(s => {
    s.walletRequests.unshift({
      id: 'wr_' + Date.now(),
      username: state.currentUser.username,

      senderName: fd.get('senderName').trim(),
      status: 'pending',
      date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    });
  });
  selectedWalletTab = 'requests';
  showToast('Bakiye talebi anında admin paneline iletildi!');

function uploadAdminSiteLogo(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = String(reader.result || '');
    if (!dataUrl) return;
    await commitSharedMutation(s => {
      s.siteLogoUrl = dataUrl;
    });
    applyFaviconLogo(dataUrl);
    showToast('Site ikonu ve logosu canlı olarak güncellendi!');
  };
  reader.readAsDataURL(file);
}

async function resetAdminSiteLogo() {
  await commitSharedMutation(s => {
    s.siteLogoUrl = DEFAULT_NVL_LOGO_DATA_URL;
  });
  applyFaviconLogo(DEFAULT_NVL_LOGO_DATA_URL);
  showToast('Varsayılan NVL kalkan logosuna dönüldü.');
}

function adminLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (fd.get('u').trim() === ADMIN_CREDS.user && fd.get('p') === ADMIN_CREDS.pass) {
    session.adminUnlocked = true;
    saveSession();
    renderAll(false);
  } else {
    showToast('Hatalı admin bilgileri.');
  }
}

    });
  });
  showToast('Duyuru anında tüm ekranlara yayınlandı!');
}

async function approveWalletRequest(reqId) {
  await commitSharedMutation(s => {
    const req = s.walletRequests.find(r => r.id === reqId);
    if (!req || req.status !== 'pending') return;
    req.status = 'approved';
    const usr = s.users.find(u => u.username === req.username);
    if (usr) {
      usr.balance = Number(usr.balance || 0) + Number(req.amount || 0);
      s.transactions = s.transactions || [];
      s.transactions.unshift({
        id: 'tx_' + Date.now(),
        username: usr.username,
        title: 'Bakiye Yükleme Onayı',
        amount: Number(req.amount || 0),
        date: new Date().toLocaleString('tr-TR')
      });
      pushNotificationToTarget(s, usr.username, `${req.amount} V bakiye talebiniz onaylandı ve hesabınıza tanımlandı.`);
    }
  });
  showToast('Bakiye talebi onaylandı ve kullanıcı hesabına anında yansıtıldı.');
}

async function toggleOrgPerm(username) {
  await commitSharedMutation(s => {
    const u = s.users.find(x => x.username === username);
    if (!u) return;
    u.canCreateTournament = !u.canCreateTournament;
    if (u.canCreateTournament) {
      u.badges = [...new Set([...(u.badges || ['NVL Üye']), 'NVL Organizatör'])];
      pushNotificationToTarget(s, username, 'Turnuva açma yetkiniz aktif edildi.');
    }
  });
  showToast(`@${username} turnuva yetkisi anında güncellendi.`);
}

async function grantBadgeToUser(username, badgeTitle) {
  await commitSharedMutation(s => {
    const u = s.users.find(x => x.username === username);
    if (!u) return;
    u.badges = [...new Set([...(u.badges || ['NVL Üye']), badgeTitle])];
    pushNotificationToTarget(s, username, `"${badgeTitle}" rozeti hesabınıza tanımlandı.`);
  });
  showToast(`${badgeTitle} rozeti tanımlandı.`);
}

function openAnnouncementModal(id) {
  const a = state.announcements.find(x => x.id === id);
  if (!a) return;
  openModal(`<div class="modal-head"><h3>${escapeHtml(a.title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><p style="white-space:pre-line;">${escapeHtml(a.content)}</p>`);
}

function openModal(html) {
  document.getElementById('modalCard').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

function escapeHtml(str) {
  return String(str ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function escapeAttr(str) {
  return escapeHtml(str).replaceAll('`', '&#96;');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeExploreDrawer();
    closeModal();
  }
});
